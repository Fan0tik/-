<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Lagniappe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .main-card {
            background: #141414;
            border-radius: 32px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a2a;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #ffd966;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
        }

        .user-balance {
            color: #ffd966;
            font-weight: 600;
            font-size: 18px;
        }

        .wheel-container {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 24px 16px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .wheel-items {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            min-height: 100px;
            align-items: center;
        }

        .wheel-item {
            font-size: 48px;
            animation: spin 3s infinite linear;
            display: inline-block;
        }

        .wheel-item:nth-child(1) { animation-duration: 2.5s; }
        .wheel-item:nth-child(2) { animation-duration: 3.2s; }
        .wheel-item:nth-child(3) { animation-duration: 2.8s; }
        .wheel-item:nth-child(4) { animation-duration: 3.5s; }
        .wheel-item:nth-child(5) { animation-duration: 2.2s; }
        .wheel-item:nth-child(6) { animation-duration: 3s; }

        @keyframes spin {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        .open-btn {
            background: linear-gradient(135deg, #ffd966, #ffb347);
            color: #0a0a0a;
            border: none;
            border-radius: 60px;
            padding: 18px;
            font-size: 20px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-bottom: 24px;
            transition: 0.2s;
        }

        .open-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .prizes-section {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #333;
        }

        .prizes-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: left;
        }

        .prizes-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .prizes-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .prizes-scroll::-webkit-scrollbar-thumb {
            background: #ffd966;
            border-radius: 10px;
        }

        .prize-item {
            min-width: 70px;
            height: 70px;
            background: #2a2a2a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #444;
        }

        .prize-emoji {
            font-size: 28px;
        }

        .prize-name {
            font-size: 10px;
            color: #aaa;
        }

        .result-popup {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
            border: 2px solid #ffd966;
            display: none;
        }

        .result-emoji {
            font-size: 64px;
            margin-bottom: 8px;
        }

        .result-text {
            color: #ffd966;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="header">
            <div class="avatar" id="avatar">😎</div>
            <div class="user-info">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-balance" id="userBalance">1000 🪙</div>
            </div>
        </div>

        <div class="wheel-container">
            <div class="wheel-items" id="wheel">
                <span class="wheel-item">🎁</span>
                <span class="wheel-item">🧸</span>
                <span class="wheel-item">💝</span>
                <span class="wheel-item">🌹</span>
                <span class="wheel-item">🚀</span>
                <span class="wheel-item">💎</span>
            </div>
        </div>

        <button class="open-btn" id="openBtn">🎲 ОТКРЫТЬ КЕЙС</button>

        <div class="prizes-section">
            <div class="prizes-title">🎯 Вы можете выиграть:</div>
            <div class="prizes-scroll" id="prizesScroll">
                <div class="prize-item"><span class="prize-emoji">🎁</span><span class="prize-name">Подарок</span></div>
                <div class="prize-item"><span class="prize-emoji">🧸</span><span class="prize-name">Мишка</span></div>
                <div class="prize-item"><span class="prize-emoji">💝</span><span class="prize-name">Сердце</span></div>
                <div class="prize-item"><span class="prize-emoji">🌹</span><span class="prize-name">Роза</span></div>
                <div class="prize-item"><span class="prize-emoji">🚀</span><span class="prize-name">Ракета</span></div>
                <div class="prize-item"><span class="prize-emoji">💎</span><span class="prize-name">Бриллиант</span></div>
            </div>
        </div>

        <div class="result-popup" id="resultPopup">
            <div class="result-emoji" id="resultEmoji">🎁</div>
            <div class="result-text" id="resultText">Вы выиграли подарок!</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        document.getElementById('userName').textContent = user?.first_name || 'Игрок';
        
        if (user?.photo_url) {
            document.getElementById('avatar').innerHTML = `<img src="${user.photo_url}" style="width:48px; height:48px; border-radius:50%;">`;
        }

        let balance = 1000;
        document.getElementById('userBalance').textContent = balance + ' 🪙';

        const prizes = [
            { emoji: '🎁', name: 'Подарок' },
            { emoji: '🧸', name: 'Мишка' },
            { emoji: '💝', name: 'Сердце' },
            { emoji: '🌹', name: 'Роза' },
            { emoji: '🚀', name: 'Ракета' },
            { emoji: '💎', name: 'Бриллиант' }
        ];

        document.getElementById('openBtn').addEventListener('click', function() {
            if (balance < 100) {
                alert('Недостаточно монет!');
                return;
            }

            balance -= 100;
            document.getElementById('userBalance').textContent = balance + ' 🪙';

            const wheel = document.getElementById('wheel');
            wheel.style.animation = 'none';
            wheel.offsetHeight;
            wheel.style.animation = 'spin 0.5s infinite linear';

            setTimeout(() => {
                wheel.style.animation = '';

                const randomIndex = Math.floor(Math.random() * prizes.length);
                const prize = prizes[randomIndex];

                document.getElementById('resultEmoji').textContent = prize.emoji;
                document.getElementById('resultText').textContent = `Вы выиграли: ${prize.name}!`;
                document.getElementById('resultPopup').style.display = 'block';

                tg.sendData(JSON.stringify({
                    action: 'case_opened',
                    prize: prize.name,
                    emoji: prize.emoji
                }));

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('heavy');
                }

            }, 800);
        });

        tg.BackButton.onClick(() => tg.close());
    </script>
</body>
</html>
