<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Lagniappe — рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .main-card {
            background: #141414;
            border-radius: 32px;
            padding: 20px 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a2a;
        }

        /* ШАПКА */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #ffd966;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
        }

        .user-balance {
            color: #ffd966;
            font-weight: 700;
            font-size: 20px;
        }

        /* КОНТЕЙНЕР РУЛЕТКИ */
        .wheel-wrapper {
            position: relative;
            margin-bottom: 20px;
            background: #1e1e1e;
            border-radius: 24px;
            padding: 16px 0;
            border: 1px solid #333;
            overflow: hidden;
        }

        /* СИНЯЯ ПОЛОСКА */
        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #2ea6ff;
            box-shadow: 0 0 20px #2ea6ff;
            z-index: 10;
            pointer-events: none;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 16px;
            height: 16px;
            background: #2ea6ff;
            border-radius: 50%;
            filter: blur(5px);
        }

        /* ЛЕНТА С ПРИЗАМИ */
        .wheel-items {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            will-change: transform;
        }

        .wheel-item {
            min-width: 70px;
            height: 90px;
            background: #2a2a2a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
            flex-shrink: 0;
            transition: all 0.1s;
        }

        .wheel-item.highlight {
            border: 3px solid #ffd966;
            transform: scale(1.05);
            background: #333;
        }

        .prize-emoji {
            font-size: 32px;
        }

        .prize-price {
            font-size: 12px;
            color: #ffd966;
            font-weight: 600;
        }

        /* КНОПКА */
        .open-btn {
            background: linear-gradient(135deg, #ffd966, #ffb347);
            color: #0a0a0a;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .open-btn:active {
            transform: scale(0.97);
        }

        /* СЕТКА ПРИЗОВ */
        .prizes-section {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #333;
        }

        .prizes-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .prizes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .prize-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 6px;
            width: calc(33.33% - 4px);
            text-align: center;
            border: 1px solid #444;
        }

        .prize-card-emoji {
            font-size: 22px;
        }

        .prize-card-name {
            font-size: 10px;
            font-weight: 600;
        }

        .prize-card-price {
            font-size: 9px;
            color: #ffd966;
        }

        .prize-card-chance {
            font-size: 8px;
            color: #888;
        }

        /* РЕЗУЛЬТАТ */
        .result-popup {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            text-align: center;
            border: 2px solid #ffd966;
            display: none;
        }

        .result-emoji {
            font-size: 48px;
        }

        .result-text {
            color: #ffd966;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- ШАПКА -->
        <div class="header">
            <div class="avatar" id="avatar">😎</div>
            <div class="user-info">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-balance" id="userBalance">1000</div>
            </div>
        </div>

        <!-- РУЛЕТКА -->
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel-items" id="wheelItems">
                <!-- JS заполнит -->
            </div>
        </div>

        <!-- КНОПКА -->
        <button class="open-btn" id="openBtn">🎲 ОТКРЫТЬ ЗА 100</button>

        <!-- ВСЕ ПРИЗЫ -->
        <div class="prizes-section">
            <div class="prizes-title">🎯 Все призы:</div>
            <div class="prizes-grid" id="prizesGrid"></div>
        </div>

        <!-- РЕЗУЛЬТАТ -->
        <div class="result-popup" id="resultPopup">
            <div class="result-emoji" id="resultEmoji">🎁</div>
            <div class="result-text" id="resultText">Выигрыш</div>
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.disableClosingConfirmation(); // НЕ ЗАКРЫВАТЬ!
        tg.BackButton.onClick(() => tg.close());

        // Пользователь
        const user = tg.initDataUnsafe?.user;
        if (user?.first_name) {
            document.getElementById('userName').textContent = user.first_name;
        }
        if (user?.photo_url) {
            document.getElementById('avatar').innerHTML = `<img src="${user.photo_url}">`;
        }

        // Баланс
        let balance = localStorage.getItem('balance') ? parseInt(localStorage.getItem('balance')) : 1000;
        document.getElementById('userBalance').textContent = balance;

        // ПРИЗЫ (твои данные)
        const prizes = [
            { emoji: '🧸', name: 'Мишка', price: 15, chance: 42.5 },
            { emoji: '💝', name: 'Сердце', price: 15, chance: 42.5 },
            { emoji: '🎁', name: 'Подарок', price: 25, chance: 6 },
            { emoji: '🌹', name: 'Роза', price: 25, chance: 5 },
            { emoji: '🚀', name: 'Ракета', price: 50, chance: 0.8 },
            { emoji: '🎂', name: 'Торт', price: 50, chance: 0.8 },
            { emoji: '💐', name: 'Букет', price: 50, chance: 0.8 },
            { emoji: '🍾', name: 'Шампанское', price: 50, chance: 0.8 },
            { emoji: '💎', name: 'Бриллиант', price: 100, chance: 0.3 },
            { emoji: '💍', name: 'Кольцо', price: 100, chance: 0.3 },
            { emoji: '🏆', name: 'Кубок', price: 100, chance: 0.2 }
        ];

        // Создаём длинную ленту для рулетки (повторяем призы 5 раз)
        let wheelPrizes = [];
        for (let i = 0; i < 5; i++) {
            wheelPrizes = wheelPrizes.concat(prizes);
        }

        // Отрисовка рулетки
        const wheelContainer = document.getElementById('wheelItems');
        function renderWheel() {
            wheelContainer.innerHTML = '';
            wheelPrizes.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.innerHTML = `
                    <span class="prize-emoji">${p.emoji}</span>
                    <span class="prize-price">${p.price}</span>
                `;
                wheelContainer.appendChild(item);
            });
        }
        renderWheel();

        // Отрисовка сетки призов
        const grid = document.getElementById('prizesGrid');
        prizes.forEach(p => {
            const card = document.createElement('div');
            card.className = 'prize-card';
            card.innerHTML = `
                <div class="prize-card-emoji">${p.emoji}</div>
                <div class="prize-card-name">${p.name}</div>
                <div class="prize-card-price">${p.price}</div>
                <div class="prize-card-chance">${p.chance}%</div>
            `;
            grid.appendChild(card);
        });

        // Выбор приза по шансам
        function getRandomPrize() {
            const rand = Math.random() * 100;
            let sum = 0;
            for (let p of prizes) {
                sum += p.chance;
                if (rand < sum) return p;
            }
            return prizes[0];
        }

        // Открытие кейса
        document.getElementById('openBtn').addEventListener('click', function() {
            if (balance < 100) {
                alert('Не хватает монет');
                return;
            }

            // Списание
            balance -= 100;
            document.getElementById('userBalance').textContent = balance;
            localStorage.setItem('balance', balance);

            // Выбираем случайный приз
            const winPrize = getRandomPrize();

            // Находим его индекс в ленте (первое вхождение)
            const winIndex = wheelPrizes.findIndex(p => p.emoji === winPrize.emoji);

            // Смещение, чтобы этот индекс оказался под полоской
            const itemWidth = 78; // ширина + gap
            const targetX = winIndex * itemWidth - (wheelContainer.offsetWidth / 2 - itemWidth / 2);

            // Анимация
            const startTime = Date.now();
            const duration = 2000;
            const startX = parseInt(wheelContainer.style.transform?.replace('translateX(', '')?.replace('px)', '')) || 0;

            function animate() {
                const now = Date.now();
                const progress = Math.min((now - startTime) / duration, 1);
                
                // Easing
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentX = startX + (targetX - startX) * easeOut;
                
                wheelContainer.style.transform = `translateX(${currentX}px)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Подсветка выигрыша
                    document.querySelectorAll('.wheel-item').forEach((el, idx) => {
                        if (idx === winIndex) {
                            el.classList.add('highlight');
                        }
                    });

                    // Показываем результат
                    document.getElementById('resultEmoji').textContent = winPrize.emoji;
                    document.getElementById('resultText').textContent = `${winPrize.name} (${winPrize.price}🪙)`;
                    document.getElementById('resultPopup').style.display = 'block';

                    // Отправляем в Telegram
                    tg.sendData(JSON.stringify({
                        prize: winPrize.name,
                        emoji: winPrize.emoji,
                        price: winPrize.price
                    }));

                    // Вибро
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('heavy');
                    }
                }
            }

            animate();
        });
    </script>
</body>
</html>
